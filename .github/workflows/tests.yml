name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: ['11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 13 needs pestphp/pest-plugin-laravel ^4.0, whose own PHP
          # requirement is ^8.3. Nothing can satisfy Laravel 13 on PHP 8.2,
          # so the combination is dropped rather than left to fail. The
          # package itself still supports PHP 8.2 on Laravel 11 and 12.
          - php: 8.2
            laravel: '13.*'
        include:
          # orchestra/testbench-core 9.0-9.9.x has a real bug: the
          # "@testbench" path alias never gets expanded when resolving the
          # bootstrap cache / compiled views paths, so any command that
          # touches them (including our own composer.json's
          # post-autoload-dump script) fails with "The @testbench/... must
          # be present and writable." Fixed upstream by 9.10.0.
          - laravel: '11.*'
            testbench: '^9.10'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          # Composer 2.9 refuses to resolve to any laravel/framework 11.x
          # release with an open security advisory, which as of writing is
          # all of them. That's a real ecosystem gap upstream, not
          # something this workflow should paper over for real installs,
          # so it's only disabled here for compatibility testing.
          composer config audit.block-insecure false
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
