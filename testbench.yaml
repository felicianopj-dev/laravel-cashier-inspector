laravel: '@testbench'

# Telescope is a dev dependency, purely so the tests exercise its real API.
# Package discovery registers it in the workbench app too, where it has no
# tables and logs a failed insert on every request, so it stays switched off
# here. Nothing about this package's Telescope integration needs it running.
env:
  - TELESCOPE_ENABLED=false

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations
  - database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/cashier-inspector'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
